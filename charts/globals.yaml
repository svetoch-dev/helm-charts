global:
  company:
    name: #example
    domain: #example.com
  repo:
    type:
    provider:
    group:
    name:
    revision:
  envs: {}
  #Cant use env: here because
  #env is already set as global
  #attr in original argocd chart
  env:
    name: #aws-prd or aws-int or aws-stg
    server: #https://2.2.2.2
    short_name: #gcp-pre/gcp-prd/gcp-int/etc
    users:
      domain: ""
      admin:
        emails: []
      qa:
        emails: []
      dev:
        emails: []
      pm:
        emails: []
    dns:
      root:
      domain:
      provider:
    cloud:
      name: ""
  ingress:
    class: pomerium
  access:
    teams: ["admin"]
    emails: []
  alerts: {}
  pomerium:
    policy:
      default: |
        {{- $teams  := .Values.global.env.users }}
        {{- $emails := .Values.global.access.emails }}
        {{- range $team := .Values.global.access.teams }}
        {{- $emails = concat $emails (get $teams $team).emails }}
        {{- end }}
        allow:
          or:
            {{- range $email :=  $emails }}
            - email:
                is: {{ $email }}
            {{- end }}
