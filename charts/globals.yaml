global:
  company:
    name: #example
    domain: #example.com
  repo:
    type:
    provider:
    url:
    group:
    name:
    revision:
  #Cant use env: here because
  #env is already set as global
  #attr in original argocd chart
  env:
    name: #aws-prd or aws-int or aws-stg
    cloud_short_name: #gcp-prd, gcp-int, etc; stable infrastructure identifier
    short_name: #gcp-pre/gcp-prd/gcp-int/etc
    users: {}
    kubernetes:
      server: #https://2.2.2.2
    dns:
      domain:
      type:
    cloud:
      name: ""
      buckets:
        type:
  ingress:
    class: pomerium
  access:
    roles: ["owner"]
  alerts: {}
  vedro:
    buckets:
      default:
        cloudSpecificConfig: |-
          {{- if eq .Values.global.env.cloud.name "gcp" }}
          gcp:
            softDeletePolicy:
              retentionDuration: "0s"
          {{- end }}
    providers:
      default:
        projectId: |-
          {{- if eq .Values.global.env.cloud.name "gcp" }}
          {{- .Values.global.env.cloud.id }}
          {{- else if eq .Values.global.env.cloud.name "yc" }}
          {{- .Values.global.env.cloud.folder_id }}
          {{- else }}
          {{- fail "Wrong .Values.global.env.cloud.name" }}
          {{- end }}
    principals:
      default:
        auth: |-
          {{- if has .Values.global.env.cloud.name (list "yc") }}
          method: StaticCredentials
          staticCredentials:
            secretRef:
              name: {{ .Values.global.vedro.principals.default.secretName | default "bucket" }}
          {{- else if has .Values.global.env.cloud.name (list "gcp") }}
          method: WorkloadIdentity
          workloadIdentity:
            serviceAccountRef:
              name: "{{ .Release.Name }}"
          {{- else }}
          {{- fail "Wrong .Values.global.env.cloud.name" }}
          {{- end }}
  pomerium:
    policy:
      default: |
        {{- $emails := list }}
        {{- $domains := list }}
        {{- $roles := .Values.global.access.roles }}
        {{- range $user := .Values.global.env.users }}
        {{- range $role := $user.roles }}
        {{- if has $role $roles }}
        {{- if hasPrefix "*@" $user.name }}
        {{- $domains = append $domains (trimPrefix "*@" $user.name) }}
        {{- else }}
        {{- $emails = append $emails $user.name }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- $emails = uniq $emails }}
        {{- $domains = uniq $domains }}
        allow:
          or:
            {{- range $email :=  $emails }}
            - email:
                is: {{ $email }}
            {{- end }}
            {{- range $domain := $domains }}
            - domain:
                is: {{ $domain }}
            {{- end }}
