apiVersion: v2
name: loki
description: loki stack for all environments
type: application
version: 0.1.0

dependencies:
  # https://github.com/grafana-community/helm-charts/tree/main/charts/loki
  - name: loki
    version: 21.0.0
    repository: oci://ghcr.io/grafana-community/helm-charts
    alias: loki
    condition: loki.enabled
  - name: vedro
    version: 0.2.2
    repository: oci://ghcr.io/svetoch-dev/charts
    alias: vedro
    condition: vedro.enabled
  - name: kong-plugins
    version: 0.1.0
    repository: file://../chart_deps/konghq/plugins
    alias: kong-plugins
    condition: kong-plugins.enabled
  - name: core
    version: 0.1.0
    repository: file://../chart_deps/app/core
