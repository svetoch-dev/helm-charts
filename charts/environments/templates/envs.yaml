{{- $resolvedEnvs := dict -}}
{{- range $envName, $env := .Values.global.envs -}}
{{- if $env.enabled -}}
{{- $_ := set $resolvedEnvs $envName (include "infra.resolveEnv" (dict "root" $ "name" $envName "env" $env) | fromYaml) -}}
{{- end -}}
{{- end -}}
{{- range $env_name, $env_obj := $resolvedEnvs -}}
{{- $structuredEnvName := required (printf "global.envs.%s.name is required" $env_name) $env_obj.name -}}
{{- $shortName := required (printf "global.envs.%s.short_name is required" $env_name) $env_obj.short_name -}}
{{- $registryUrl := required (printf "global.envs.%s.registry.url is required" $env_name) (dig "registry" "url" "" $env_obj) -}}
{{- $dnsRoot := required (printf "global.envs.%s.dns.root is required" $env_name) (dig "dns" "root" "" $env_obj) -}}
{{- $dnsDomain := required (printf "global.envs.%s.dns.domain is required" $env_name) (dig "dns" "domain" "" $env_obj) -}}
{{- $cloud := required (printf "global.envs.%s.cloud is required" $env_name) $env_obj.cloud -}}
{{- $cloudName := required (printf "global.envs.%s.cloud.name is required" $env_name) $cloud.name -}}
{{- $_ := required (printf "global.envs.%s.cloud.buckets.type is required" $env_name) $cloud.buckets.type -}}
{{- $server := required (printf "global.envs.%s.server is required" $env_name) $env_obj.server -}}
{{- $cloudShortName := required (printf "global.envs.%s.cloud_short_name is required" $env_name) $env_obj.cloud_short_name -}}
{{- $externalEnvs := dict -}}
{{- if eq (dig "type" "" $env_obj) "internal" -}}
{{- range $externalEnvName, $externalEnvObj := $resolvedEnvs -}}
{{- if and $externalEnvObj.enabled (eq (dig "type" "" $externalEnvObj) "product") -}}
{{- $externalCloudShortName := required (printf "global.envs.%s.cloud_short_name is required" $externalEnvName) $externalEnvObj.cloud_short_name -}}
{{- $externalDnsDomain := required (printf "global.envs.%s.dns.domain is required" $externalEnvName) (dig "dns" "domain" "" $externalEnvObj) -}}
{{- $_ := set $externalEnvs $externalCloudShortName (dict "domain" $externalDnsDomain) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $finalizers := $.Values.environment.finalizers -}}
{{- if hasKey $env_obj "finalizers" -}}
{{- $finalizers = $env_obj.finalizers -}}
{{- end -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $cloudShortName }}
  namespace: argocd
  {{- with $finalizers }}
  finalizers:
  {{- toYaml . | nindent 6 }}
  {{- end }}
  labels:
  {{- with $.Values.labels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $env_obj.labels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    path: {{ $.Values.repository.paths.env_chart}}
    repoURL: {{ include "infra.repoURL" $ }}
    targetRevision: {{ $env_obj.revision | default (include "infra.repoRevision" $) }}
    helm:
      valueFiles:
        - ../globals.yaml
        - {{ tpl (printf "%s/environments/%s/env.yaml" $.Values.repository.paths.root_from_chart $cloudShortName ) $ }}
    {{- with $env_obj.parameters }}
      parameters:
    {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
      valuesObject:
        global:
          company:
            name: {{ $.Values.global.company.name }}
            domain: {{ $dnsRoot }}
          repo:
          {{- toYaml $.Values.global.repo | nindent 12 }}
          env:
            name: {{ $structuredEnvName }}
            enabled: {{ $env_obj.enabled }}
            server: {{ $server }}
            short_name: {{ $shortName }}
            cloud_short_name: {{ $cloudShortName }}
            {{- with $env_obj.type }}
            type: {{ . }}
            {{- end }}
            registry:
              url: {{ $registryUrl }}
            {{- with $env_obj.users }}
            users:
            {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $env_obj.apps }}
            apps:
            {{- toYaml . | nindent 14 }}
            {{- end }}
            dns:
              root: {{ $dnsRoot }}
              domain: {{ $dnsDomain }}
              {{- with $env_obj.dns.provider }}
              provider: {{ . }}
              {{- end }}
            kubernetes:
            {{- toYaml $env_obj.kubernetes | nindent 14 }}
            cloud:
            {{- toYaml $cloud | nindent 14 }}
          {{- with $env_obj.alerts }}
          alerts:
          {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with $externalEnvs }}
        externalEnvs:
        {{- toYaml . | nindent 10 }}
        {{- end }}
  {{- with $env_obj.syncPolicy }}
  syncPolicy:
  {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
