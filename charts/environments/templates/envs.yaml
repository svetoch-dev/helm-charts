{{- range $env_name, $env_obj := .Values.global.envs -}}
{{- if $env_obj.enabled -}}
{{- $structuredEnvName := required (printf "global.envs.%s.name is required" $env_name) $env_obj.name -}}
{{- $shortName := required (printf "global.envs.%s.short_name is required" $env_name) $env_obj.short_name -}}
{{- $registryTemplate := required (printf "global.envs.%s.registry.url is required" $env_name) (dig "registry" "url" "" $env_obj) -}}
{{- $companyDomain := required "global.company.domain is required" $.Values.global.company.domain -}}
{{- $dnsRoot := $companyDomain -}}
{{- $dnsDomain := printf "%s.%s" $shortName $companyDomain -}}
{{- if $env_obj.dns -}}
{{- $dnsRoot = $env_obj.dns.root | default $dnsRoot -}}
{{- $dnsDomain = $env_obj.dns.domain | default $dnsDomain | trimSuffix "." -}}
{{- end -}}
{{- $cloud := required (printf "global.envs.%s.cloud is required" $env_name) $env_obj.cloud -}}
{{- $cloudName := required (printf "global.envs.%s.cloud.name is required" $env_name) $cloud.name -}}
{{- $_ := required (printf "global.envs.%s.cloud.buckets.type is required" $env_name) $cloud.buckets.type -}}
{{- $server := required (printf "global.envs.%s.kubernetes.server is required" $env_name) (dig "kubernetes" "server" "" $env_obj) -}}
{{- $cloudShortName := printf "%s-%s" $cloudName $shortName -}}
{{- $envForTpl := mergeOverwrite (deepCopy $env_obj) (dict "server" $server "short_name" $shortName "cloud_short_name" $cloudShortName "dns" (dict "root" $dnsRoot "domain" $dnsDomain "provider" (dig "dns" "provider" "" $env_obj))) -}}
{{- $tplValues := mergeOverwrite (deepCopy $.Values) (dict "global" (mergeOverwrite (deepCopy $.Values.global) (dict "env" $envForTpl))) -}}
{{- $dnsDomain = tpl $dnsDomain (mergeOverwrite (deepCopy $) (dict "Values" $tplValues)) -}}
{{- $registryUrl := tpl $registryTemplate (mergeOverwrite (deepCopy $) (dict "Values" $tplValues)) -}}
{{- $finalizers := $.Values.environment.finalizers -}}
{{- if hasKey $env_obj "finalizers" -}}
{{- $finalizers = $env_obj.finalizers -}}
{{- end -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $cloudShortName }}
  namespace: argocd
  {{- with $finalizers }}
  finalizers:
  {{- toYaml . | nindent 6 }}
  {{- end }}
  labels:
  {{- with $.Values.labels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $env_obj.labels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    path: {{ $.Values.repository.paths.env_chart}}
    repoURL: {{ include "infra.repoURL" $ }}
    targetRevision: {{ $env_obj.revision | default (include "infra.repoRevision" $) }}
    helm:
      valueFiles:
        - ../globals.yaml
        - {{ tpl (printf "%s/environments/%s/env.yaml" $.Values.repository.paths.root_from_chart $cloudShortName ) $ }}
    {{- with $env_obj.parameters }}
      parameters:
    {{- tpl (toYaml .) $ | nindent 8 }}
    {{- end }}
      valuesObject:
        global:
          company:
            name: {{ $.Values.global.company.name }}
            domain: {{ $dnsRoot }}
          repo:
          {{- toYaml $.Values.global.repo | nindent 12 }}
          envs:
          {{- toYaml $.Values.global.envs | nindent 12 }}
          env:
            name: {{ $structuredEnvName }}
            enabled: {{ $env_obj.enabled }}
            server: {{ $server }}
            short_name: {{ $shortName }}
            cloud_short_name: {{ $cloudShortName }}
            {{- with $env_obj.long_name }}
            long_name: {{ . }}
            {{- end }}
            {{- with $env_obj.type }}
            type: {{ . }}
            {{- end }}
            registry:
              url: {{ $registryUrl }}
            {{- with $env_obj.users }}
            users:
            {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with $env_obj.apps }}
            apps:
            {{- toYaml . | nindent 14 }}
            {{- end }}
            dns:
              root: {{ $dnsRoot }}
              domain: {{ $dnsDomain }}
              {{- with $env_obj.dns.provider }}
              provider: {{ . }}
              {{- end }}
            kubernetes:
            {{- toYaml $env_obj.kubernetes | nindent 14 }}
            cloud:
            {{- toYaml $cloud | nindent 14 }}
          {{- with $env_obj.alerts }}
          alerts:
          {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with $env_obj.externalEnvs }}
        externalEnvs:
        {{- toYaml . | nindent 10 }}
        {{- end }}
  {{- with $env_obj.syncPolicy }}
  syncPolicy:
  {{- toYaml . | nindent 4 }}
  {{- end }}
{{ end }}
{{- end }}
