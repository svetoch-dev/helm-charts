gha-runner:
  enabled: false
  runnerScaleSetName: "infra-runner"
  kubernetesModeServiceAccount:
  controllerServiceAccount:
    namespace: gha-operator
    name: "gha-operator"
  containerMode:
    type: "kubernetes-novolume"
  listenerTemplate:
    spec:
      containers:
        - name: listener
          resources:
            limits:
              cpu: 300m
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
  template:
    spec:
      nodeSelector:
        runner: 'true'
      tolerations:
        - key: runner
          operator: Equal
          value: 'true'
          effect: NoSchedule
      securityContext:
        fsGroup: 1001
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command: ["/home/runner/run.sh"]
          resources:
            requests:
              cpu: 30m
              memory: 240Mi
            limits:
              cpu: 300m
              memory: 500Mi
          env:
            - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
              value: 'false'
            - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
              value: /home/runner/templates/workflow-pod.yaml
          volumeMounts:
            - mountPath: /home/runner/templates
              name: templates
      volumes:
        - name: templates
          configMap:
            name: workflow-pod
workflowConfigMap:
  enabled: false
  name: workflow-pod
  metaAnnotations:
    argocd.argoproj.io/tracking-id: "{{ .Release.Name }}:/Pod:{{ .Release.Namespace }}/workflow-pod"
  spec:
    securityContext:
      fsGroup: 1001
    containers:
      - name: "$job"
        resources:
          requests:
            cpu: '1'
            memory: 4Gi
