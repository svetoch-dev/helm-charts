gha-runner:
  enabled: false
  runnerScaleSetName: "infra-runner"
  kubernetesModeServiceAccount:
  controllerServiceAccount:
    namespace: gha-operator
    name: "gha-operator"
  containerMode:
    type: "kubernetes-novolume"
  listenerTemplate:
    spec:
      containers:
        - name: listener
          resources:
            limits:
              cpu: 300m
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi
  template:
    spec:
      nodeSelector:
        runner: 'true'
      tolerations:
        - key: runner
          operator: Equal
          value: 'true'
          effect: NoSchedule
      securityContext:
        fsGroup: 1001
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:latest
          command: ["/home/runner/run.sh"]
          resources: {}
          env:
            - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
              value: "false"
workflowConfigMap:
  enabled: false
  name: workflow-pod
  metaAnnotations:
    argocd.argoproj.io/tracking-id: "{{ .Release.Name }}:/Pod:{{ .Release.Namespace }}/workflow-pod"
  spec:
    securityContext:
      fsGroup: 1001
