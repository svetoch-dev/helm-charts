external-dns:
  enabled: false
  # Overrides kept in the same layout as the upstream external-dns chart.
  resources:
    limits:
      cpu: 300m
      memory: 300Mi
    requests:
      cpu: 10m
      memory: 35Mi
  serviceAccount:
    create: false
    name: external-dns
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: '{{ .Release.Name }}'
                app.kubernetes.io/name: external-dns
            topologyKey: kubernetes.io/hostname
          weight: 1
