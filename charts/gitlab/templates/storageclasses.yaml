{{- $global := .Values.global | default dict }}
{{- $env := get $global "env" | default dict }}
{{- $cloud := get $env "cloud" | default dict }}
{{- $cloudName := get $cloud "name" | default "gcp" }}
{{- range $sc_name, $sc_obj := .Values.storageClasses }}
{{- if $sc_obj.enabled }}
{{- $provider := required (printf "storageClasses.%s does not support cloud %q; supported clouds are gcp and yc" $sc_name $cloudName) (get $sc_obj.providers $cloudName) }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $sc_name }}
  labels:
    {{- include "gitlabwrapper.labels" $ | nindent 4 }}
  {{- with $provider.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
provisioner: {{ $provider.provisioner }}
{{- with $provider.parameters }}
parameters:
  {{- tpl (toYaml .) $ | nindent 2 }}
{{- end }}
reclaimPolicy: {{ $sc_obj.reclaimPolicy | default "Retain" }}
volumeBindingMode: {{ $sc_obj.volumeBindingMode | default "WaitForFirstConsumer" }}
allowVolumeExpansion: {{ $sc_obj.allowVolumeExpansion | default true }}
{{- end }}
{{- end }}
