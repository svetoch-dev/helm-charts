# =============================================================================
# GitLab CE Minimal POC Configuration
# =============================================================================

# NOTE: `global.gatewayApi.installEnvoy` MUST be set here, at this chart's
# own root `global`, not only under `gitlab.global.gatewayApi`. The
# `envoy-gateway` dependency is a *grandchild* dependency (declared inside
# the vendored gitlab/gitlab chart's own Chart.yaml, condition
# "global.gatewayApi.installEnvoy"). Helm resolves conditions on nested
# dependencies using the root chart's top-level `global` values - setting it
# only under the "gitlab" alias key is NOT enough and silently leaves
# Envoy Gateway (+ Gateway API CRUD resources) deployed. Verified by
# rendering charts/gitlab-10.1.1.tgz through this wrapper both ways.
global:
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false

ingresses:
  webservice:
    enabled: false
    name: '{{ include "gitlabwrapper.fullname" . }}-webservice'
    service:
      # NOTE: the gitlab/gitlab chart names its webservice Service
      # "<release-name>-webservice-<deployment-name>" (default deployment
      # name is "default") - it is NOT "<release-name>-gitlab-webservice".
      # Verified by rendering charts/gitlab-10.1.1.tgz directly.
      name: '{{ .Release.Name }}-webservice-default'
      # Route to the workhorse port (8181), not the plain webservice port
      # (8080). Workhorse handles Git HTTP, LFS, and web-socket upgrades -
      # this is the same port the chart's own bundled Ingress targets.
      port: 8181
    className: "{{ .Values.global.ingress.class }}"
    annotations:
      cert-manager.io/cluster-issuer: '{{ printf "letsencrypt-%s" .Values.global.ingress.class }}'
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    hosts:
    - host: "gl.{{ .Values.global.company.domain.env }}"
      paths:
      - path: /
        pathType: Prefix
    tls:
    - secretName: gl-tls
      hosts:
      - "gl.{{ .Values.global.company.domain.env }}"

gitlab:
  enabled: false

  global:
    edition: ce

    hosts:
      domain: "{{ .Values.global.company.domain.env }}"
      gitlab:
        name: "gl.{{ .Values.global.company.domain.env }}"
        https: true

    gatewayApi:
      enabled: false
      installEnvoy: false
      configureCertmanager: false

    ingress:
      enabled: false
      configureCertmanager: false

    psql:
      host: ""
      port: 5432
      database: gitlabhq_production
      username: gitlabhq_production
      password:
        useSecret: true
        secret: ""  # SET THIS: secret name with postgres password
        key: password

    redis:
      host: ""
      port: 6379
      auth:
        enabled: true
        secret: ""  # SET THIS: secret name with redis password
        key: password

    minio:
      enabled: false

    appConfig:
      # Consolidated object storage with Workload Identity
      object_store:
        enabled: true
        proxy_download: true
        storage_options: {}
        connection:
          secret: gitlab-object-storage
          key: connection

      lfs:
        enabled: true
        bucket: ""  # SET THIS: e.g., gitlab-lfs
        connection: {}
      artifacts:
        enabled: true
        bucket: ""  # SET THIS: e.g., gitlab-artifacts
        connection: {}
      uploads:
        enabled: true
        bucket: ""  # SET THIS: e.g., gitlab-uploads
        connection: {}
      packages:
        enabled: true
        bucket: ""  # SET THIS: e.g., gitlab-packages
        connection: {}
      externalDiffs:
        enabled: false
      terraformState:
        enabled: false
      dependencyProxy:
        enabled: false

      # Backups - Workload Identity without secret
      backups:
        bucket: ""  # SET THIS: e.g., gitlab-backups
        tmpBucket: ""  # SET THIS: e.g., gitlab-tmp

    serviceAccount:
      enabled: true
      create: true
      annotations:
        iam.gke.io/gcp-service-account: ""  # SET THIS: GSA email

  # ===========================================================================
  # Disable bundled components
  # ===========================================================================
  postgresql:
    install: false

  redis:
    install: false

  nginx-ingress:
    enabled: false

  # This is the actual toggle for the bundled cert-manager dependency.
  # `certmanager.installCRDs` below only configures it IF installed - it does
  # NOT disable it. Without this, cert-manager (deployment, webhooks, CRDs
  # via install job) gets deployed redundantly alongside the company-wide
  # cert-manager already managed by charts/cert-manager. Verified by
  # rendering: without this flag, gitlab/charts/certmanager/* resources
  # were present in the output.
  installCertmanager: false

  certmanager:
    installCRDs: false

  # certmanager-issuer:
  #   email: ""

  prometheus:
    install: false

  gitlab-runner:
    install: false

  registry:
    enabled: false
    # When enabling, configure GCS storage:
    # storage:
    #   secret: gitlab-registry-storage
    #   key: config
    # bucket: ""  # SET THIS: e.g., gitlab-registry

  # ===========================================================================
  # GitLab Components
  # ===========================================================================
  gitlab:
    webservice:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 300m
          memory: 2Gi
        limits:
          memory: 4Gi
      workhorse:
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            memory: 200Mi

    sidekiq:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 2Gi

    gitaly:
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          memory: 1Gi
      persistence:
        enabled: true
        size: 20Gi  # SET THIS: storage size for repositories
        storageClass: "pd-standard"  # SET THIS: your storage class

    gitlab-shell:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
        limits:
          memory: 150Mi

    toolbox:
      enabled: true
      backups:
        objectStorage:
          # Workload Identity - no secret needed for backups
          backend: gcs
          # config.secret and config.key intentionally omitted for Workload Identity
      resources:
        requests:
          cpu: 50m
          memory: 350Mi
        limits:
          memory: 1Gi

    migrations:
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
        limits:
          memory: 2Gi

postgres-gitlab:
  enabled: false
  defaultSidecars:
    enabled: true
  podMonitor:
    enabled: true
    prometheusSelector:
      prometheus: main
  fluentbit:
    enabled: true
  prometheus-rules:
    enabled: true
    PrometheusAlerts:
      postgres:
        AbsentMetricCritical:
          enabled: true
          rules:
            pg_up:
              enabled: true
  teamId: devops
  replicas: 1
  resources:
    limits:
      cpu: 2000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 3Gi
  volume:
    size: 10Gi
    storageClass: premium-rwo
  databases:
    gitlabhq_production: gitlabhq_production
  preparedDatabases:
    gitlabhq_production:
      defaultUsers: true
  logicalBackup:
    enabled: true
    schedule: "40 00 * * *"
  postgresql:
    version: "17"
    parameters:
      password_encryption: "scram-sha-256"
      max_connections: "100"
      work_mem: "65536"
      max_wal_size: "2048"
      maintenance_work_mem: "262144"
      max_worker_processes: "4"
      max_parallel_workers: "4"
      max_parallel_workers_per_gather: "0"
      max_parallel_maintenance_workers: "4"
      max_standby_archive_delay: "400000"
      max_standby_streaming_delay: "400000"
      log_destination: "jsonlog"
      logging_collector: "true"

redis-gitlab:
  enabled: false
  redisServiceMonitor:
    enabled: true
    prometheusSelector:
      prometheus: redis-gitlab
  sentinelServiceMonitor:
    enabled: true
    prometheusSelector:
      prometheus: redis-gitlab
  auth:
    secretPath: redis-gitlab
  sentinel:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        memory: 200Mi
    exporter:
      enabled: true
  redis:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 10Mi
      limits:
        memory: 250Mi
    exporter:
      enabled: true
