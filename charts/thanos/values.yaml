# Each component is an alias of chart_deps/thanos/service.
# Keep the nested common dependency name for Helm 3 compatibility.
# Native resource settings use <component>.common; Thanos settings use common.thanos.
ingresses:
  query:
    enabled: false
    name: '{{ include "thanos.fullname" . }}-query'
    service:
      name: '{{ include "thanos.fullname" . }}-query'
      port: 9090
    className: '{{ .Values.global.ingress.class }}'
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-pomerium
      ingress.pomerium.io/policy: |
        {{- tpl .Values.global.pomerium.policy.default $ | indent 2}}
    hosts:
    - host: tq.{{ .Values.global.env.dns.domain }}
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: tq-tls
      hosts:
      - tq.{{ .Values.global.env.dns.domain }}
  storegateway:
    enabled: false
    name: '{{ include "thanos.fullname" . }}-storegateway-grpc'
    service:
      name: '{{ include "thanos.fullname" . }}-storegateway'
      port: 10901
    className: konghq
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-konghq
      konghq.com/protocols: grpc,grpcs
      konghq.com/plugins: thanos-store-main-ip-restriction
    hosts:
    - host: thanos-store.{{ .Values.global.env.dns.domain }}
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: thanos-store-tls
      hosts:
      - thanos-store.{{ .Values.global.env.dns.domain }}
kong-plugins:
  enabled: false
  plugins:
  - name: thanos-store-main-ip-restriction
    plugin_name: ip-restriction
    annotations:
      kubernetes.io/ingress.class: konghq
    config:
      allow:
      - '{{ .Values.global.env.cloud.network.int_nat_gw }}'
secrets:
  thanos:
    name: thanos
    data:
      objstore.yml: |
        type: "{{ .Values.global.env.cloud.buckets.type | upper }}"
        config:
          bucket: "{{ .Values.global.company.name }}-thanos-{{ .Values.global.env.short_name }}"
query:
  enabled: false
  common:
    thanos:
      clusterDomain: cluster.local
      dnsDiscovery:
        enabled: false
        sidecarsNamespace: ''
        sidecarsService: ''
      existingSDConfigmap: ''
      grpc:
        client:
          serverName: ''
          tls:
            autoGenerated: false
            enabled: false
            existingSecret: {}
        server:
          tls:
            clientAuthEnabled: true
            enabled: false
            existingSecret: {}
      replicaLabel:
      - replica
      stores: []
      receive:
        enabled: false
        service:
          additionalHeadless: false
      ruler:
        enabled: false
        service:
          additionalHeadless: false
        queryURL: ''
      storegateway:
        enabled: false
        service:
          additionalHeadless: false
          ports:
            grpc: 10901
        sharded:
          enabled: false
          hashPartitioning:
            shards: ''
          timePartitioning:
          - min: ''
            max: ''
        useEndpointGroup: false
      queryFrontend:
        enabled: false
        ingress:
          enabled: false
          hostname: ''
          overrideAlertQueryURL: false
          tls: false
      sdConfig: ''
    resources:
      limits:
        cpu: '2'
        memory: 2Gi
      requests:
        cpu: 10m
        memory: 50Mi
    strategy:
      type: RollingUpdate
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 10901
        - port: 9090
        - port: 10901
    additionalServices:
    - name: '{{ include "common.fullname" . }}-grpc'
      enabled: true
      type: ClusterIP
      ports:
      - name: grpc
        port: 10901
        targetPort: grpc
        protocol: TCP
    args: '{{ include "thanos.query.args" . }}'
queryFrontend:
  enabled: false
  common:
    thanos:
      query:
        service:
          ports:
            http: 9090
      config: ''
      containerPorts:
        http: 9090
      existingConfigmap: ''
      logFormat: logfmt
    containerName: query-frontend
    ports: |
      - name: http
        containerPort: {{ .Values.thanos.containerPorts.http }}
        protocol: TCP
    strategy:
      type: RollingUpdate
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 9090
        - port: 9090
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
    args: '{{ include "thanos.queryFrontend.args" . }}'
compactor:
  enabled: false
  common:
    thanos:
      concurrency: 1
      consistencyDelay: 30m
      containerPorts:
        http: 10902
      cronJob:
        enabled: false
      dataDir: /data
      extraFlags:
      - --delete-delay=48h
      retentionResolution1h: 90d
      retentionResolution5m: 60d
      retentionResolutionRaw: 30d
    containerName: compactor
    ports: |
      - name: http
        containerPort: {{ .Values.thanos.containerPorts.http }}
        protocol: TCP
    resources:
      limits:
        cpu: 1500m
        memory: 1Gi
      requests:
        cpu: 20m
        memory: 45Mi
    serviceAccount:
      create: false
      name: thanos
      automountServiceAccountToken: true
    strategy:
      type: Recreate
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
    volumes:
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: objstore-config
      mountPath: /conf
    pvcs:
      data:
        name: '{{ include "common.fullname" . }}'
        storage: 15Gi
        mountPath: '{{ .Values.thanos.dataDir }}'
    args: '{{ include "thanos.compactor.args" . }}'
storegateway:
  enabled: false
  common:
    thanos:
      bucketCacheConfig: ''
      indexCacheConfig: ''
      config: ''
      containerPorts:
        grpc: 10901
        http: 10902
      existingConfigmap: ''
      grpc:
        server:
          tls:
            clientAuthEnabled: true
            enabled: false
            existingSecret: {}
    containerName: storegateway
    deploymentEnabled: false
    statefulsetEnabled: true
    resources:
      limits:
        cpu: 1000m
        memory: 3Gi
      requests:
        cpu: 10m
        memory: 50Mi
    serviceAccount:
      create: false
      name: thanos
      automountServiceAccountToken: true
    service:
      ports:
      - port: 9090
        targetPort: http
        protocol: TCP
        name: http
      - port: 10901
        targetPort: grpc
        protocol: TCP
        name: grpc
      annotations:
        konghq.com/protocol: grpc
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
        - port: 10901
        - port: 10901
    volumes:
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: objstore-config
      mountPath: /conf
    - name: data
      mountPath: /data
    args: '{{ include "thanos.storegateway.args" . }}'
    ports: |
      - name: http
        containerPort: {{ .Values.thanos.containerPorts.http }}
        protocol: TCP
      - name: grpc
        containerPort: {{ .Values.thanos.containerPorts.grpc }}
        protocol: TCP
ruler:
  enabled: false
  common:
    thanos:
      clusterDomain: cluster.local
      query:
        enabled: true
        service:
          ports:
            http: 9090
      alertmanagers: []
      alertmanagersConfig: {}
      clusterName: ''
      containerPorts:
        grpc: 10901
        http: 10902
      dataPath: ''
      dnsDiscovery:
        enabled: true
      evalInterval: 1m
      logFormat: logfmt
      queries: []
      replicaLabel: replica
      ruleFile: /conf/rules/*.yml
      queryFrontend:
        enabled: false
        ingress:
          enabled: false
          hostname: ''
          overrideAlertQueryURL: false
          tls: false
      queryURL: ''
      config: ''
    containerName: ruler
    deploymentEnabled: false
    statefulsetEnabled: true
    service:
      ports:
      - port: 9090
        targetPort: http
        protocol: TCP
        name: http
      - port: 10901
        targetPort: grpc
        protocol: TCP
        name: grpc
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
        - port: 10901
        - port: 10901
    volumes:
    - name: ruler-config
      configMap:
        name: '{{ include "thanos-service.prefix" . }}-ruler'
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: ruler-config
      mountPath: /conf/rules
    - name: objstore-config
      mountPath: /conf/objstore
    - name: data
      mountPath: '{{ .Values.thanos.dataPath | default "/data" }}'
    environment:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    configMaps:
      rules:
        name: '{{ include "common.fullname" . }}'
        data:
          ruler.yml: '{{ required "ruler.common.thanos.config is required when ruler is enabled" .Values.thanos.config
            }}'
    podAnnotations:
      checksum/rules: '{{ .Values.thanos.config | sha256sum }}'
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
    args: '{{ include "thanos.ruler.args" . }}'
    ports: |
      - name: http
        containerPort: {{ .Values.thanos.containerPorts.http }}
        protocol: TCP
      - name: grpc
        containerPort: {{ .Values.thanos.containerPorts.grpc }}
        protocol: TCP
recieve:
  enabled: false
  common:
    thanos:
      clusterDomain: cluster.local
      existingObjstoreSecret: '{{ include "thanos-service.prefix" . }}-thanos'
      objstoreConfig: ''
      containerPorts:
        capnproto: 19391
        grpc: 10901
        http: 10902
        remote: 19291
      grpc:
        server:
          tls:
            clientAuthEnabled: true
            enabled: false
            existingSecret: {}
      logFormat: logfmt
      mode: standalone
      replicaLabel: replica
      replicationFactor: 1
      replicationProtocol: capnproto
      tsdbPath: ''
      tsdbRetention: 15d
      hashrings:
      - endpoints:
        - address: 127.0.0.1:10901
          capnproto_address: 127.0.0.1:19391
      service:
        additionalHeadless: false
    service:
      ports:
      - port: 10902
        targetPort: http
        protocol: TCP
        name: http
      - port: 10901
        targetPort: grpc
        protocol: TCP
        name: grpc
      - port: 19291
        targetPort: remote-write
        protocol: TCP
        name: remote
      - port: 19391
        targetPort: capnproto
        protocol: TCP
        name: capnproto
    containerName: receive
    deploymentEnabled: false
    statefulsetEnabled: true
    ports: |
      - name: grpc
        containerPort: {{ .Values.thanos.containerPorts.grpc }}
        protocol: TCP
      - name: http
        containerPort: {{ .Values.thanos.containerPorts.http }}
        protocol: TCP
      - name: remote-write
        containerPort: {{ .Values.thanos.containerPorts.remote }}
        protocol: TCP
      - name: capnproto
        containerPort: {{ .Values.thanos.containerPorts.capnproto }}
        protocol: TCP
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 10902
        - port: 10901
        - port: 10901
        - port: 19291
        - port: 19291
        - port: 19391
        - port: 19391
    volumes:
    - name: hashring-config
      configMap:
        name: '{{ include "thanos-service.prefix" . }}-receive'
    volumeMounts:
    - name: hashring-config
      mountPath: /var/lib/thanos-receive
    - name: data
      mountPath: '{{ .Values.thanos.tsdbPath | default "/var/thanos/receive" }}'
    environment:
    - name: NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OBJSTORE_CONFIG
      valueFrom:
        secretKeyRef:
          key: objstore.yml
          name: '{{ include "thanos-service.prefix" . }}-thanos'
    configMaps:
      hashrings:
        name: '{{ include "common.fullname" . }}'
        data:
          hashrings.json: '{{ toPrettyJson .Values.thanos.hashrings }}'
    podAnnotations:
      checksum/hashrings: '{{ toJson .Values.thanos.hashrings | sha256sum }}'
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
    args: '{{ include "thanos.receive.args" . }}'
