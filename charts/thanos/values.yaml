# Each thanos service is an instance of chart_deps/app/common.
# Keep service defaults disabled; configure workloads through their common values.
ingresses:
  query:
    enabled: false
    name: '{{ include "thanos.fullname" . }}-query'
    service:
      name: '{{ include "thanos.fullname" . }}-query'
      port: 9090
    className: '{{ .Values.global.ingress.class }}'
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-pomerium
      ingress.pomerium.io/policy: |
        {{- tpl .Values.global.pomerium.policy.default $ | indent 2}}
    hosts:
    - host: tq.{{ .Values.global.env.dns.domain }}
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: tq-tls
      hosts:
      - tq.{{ .Values.global.env.dns.domain }}
  storegateway:
    enabled: false
    name: '{{ include "thanos.fullname" . }}-storegateway-grpc'
    service:
      name: '{{ include "thanos.fullname" . }}-storegateway'
      port: 10901
    className: konghq
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-konghq
      konghq.com/protocols: grpc,grpcs
      konghq.com/plugins: thanos-store-main-ip-restriction
    hosts:
    - host: thanos-store.{{ .Values.global.env.dns.domain }}
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: thanos-store-tls
      hosts:
      - thanos-store.{{ .Values.global.env.dns.domain }}
kong-plugins:
  enabled: false
  plugins:
  - name: thanos-store-main-ip-restriction
    plugin_name: ip-restriction
    annotations:
      kubernetes.io/ingress.class: konghq
    config:
      allow:
      - '{{ .Values.global.env.cloud.network.int_nat_gw }}'
secrets:
  thanos:
    name: thanos
    data:
      objstore.yml: |
        type: "{{ .Values.global.env.cloud.buckets.type | upper }}"
        config:
          bucket: "{{ .Values.global.company.name }}-thanos-{{ .Values.global.env.short_name }}"
thanos:
  enabled: false
  query:
    enabled: false
    probes:
      enabled: false
    prometheus-rules:
      enabled: false
    fullnameOverride: '{{ include "thanos.servicePrefix" . }}-query'
    containerName: query
    selectorLabels: &selectorLabels
      app.kubernetes.io/name: thanos
      app.kubernetes.io/instance: '{{ .Release.Name }}'
      app.kubernetes.io/component: '{{ .Values.containerName }}'
    image: &thanosImage
      repository: quay.io/thanos/thanos
      tag: v0.41.0
      pullPolicy: IfNotPresent
    deploymentEnabled: true
    statefulsetEnabled: false
    replicaCount: 1
    revisionHistoryLimit: 10
    logLevel: info
    logFormat: json
    args: '{{ include "thanos.serviceArgs" . }}'
    extraFlags: []
    ports:
    - name: http
      containerPort: 10902
      protocol: TCP
    - name: grpc
      containerPort: 10901
      protocol: TCP
    livenessProbe: &livenessProbe
      failureThreshold: 6
      initialDelaySeconds: 30
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 30
      httpGet:
        path: /-/healthy
        port: http
        scheme: HTTP
    readinessProbe: &readinessProbe
      failureThreshold: 6
      initialDelaySeconds: 30
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 30
      httpGet:
        path: /-/ready
        port: http
        scheme: HTTP
    resources:
      limits:
        cpu: '2'
        memory: 2Gi
      requests:
        cpu: 10m
        memory: 50Mi
    podSecurityContext: &podSecurityContext
      fsGroup: 1001
      fsGroupChangePolicy: Always
      supplementalGroups: []
      sysctls: []
    securityContext: &securityContext
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 1001
      runAsNonRoot: true
      runAsUser: 1001
      seLinuxOptions: {}
      seccompProfile:
        type: RuntimeDefault
    automountServiceAccountToken: true
    disableGlobalEnvironment: true
    disableGlobalEnvironmentFromSecrets: true
    affinity: &affinity
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: thanos
                app.kubernetes.io/instance: '{{ .Release.Name }}'
                app.kubernetes.io/component: '{{ .Values.containerName }}'
            topologyKey: kubernetes.io/hostname
    podLabels:
      app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    serviceAccount:
      create: true
      name: ''
      automountServiceAccountToken: false
    strategy:
      type: RollingUpdate
    service:
      enabled: true
      name: '{{ include "common.fullname" . }}'
      type: ClusterIP
      ports:
      - port: 9090
        targetPort: http
        protocol: TCP
        name: http
      labels:
        prometheus-operator/monitor: 'true'
    serviceMonitor:
      enabled: true
      jobLabel: ''
      prometheusSelector:
        prometheus: main
      selectorLabels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/instance: '{{ .Release.Name }}'
        app.kubernetes.io/component: '{{ .Values.containerName }}'
        prometheus-operator/monitor: 'true'
      endpoints:
      - port: http
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      enabled: true
      policyTypes:
      - Ingress
      - Egress
      egress:
      - {}
      ingress:
      - ports:
        - port: 10902
        - port: 10901
        - port: 9090
        - port: 10901
    stores: []
    replicaLabel: replica
    additionalServices:
    - name: '{{ include "common.fullname" . }}-grpc'
      enabled: true
      type: ClusterIP
      ports:
      - name: grpc
        port: 10901
        targetPort: grpc
        protocol: TCP
  queryFrontend:
    enabled: false
    probes:
      enabled: false
    prometheus-rules:
      enabled: false
    fullnameOverride: '{{ include "thanos.servicePrefix" . }}-query-frontend'
    containerName: query-frontend
