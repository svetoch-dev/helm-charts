# Each service is an alias of chart_deps/thanos/service.
# Shared defaults live there; keep only service-specific overrides here.
ingresses:
  query:
    enabled: false
    name: '{{ include "thanos.fullname" . }}-query'
    service:
      name: '{{ include "thanos.fullname" . }}-query'
      port: 9090
    className: '{{ .Values.global.ingress.class }}'
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-pomerium
      ingress.pomerium.io/policy: |
        {{- tpl .Values.global.pomerium.policy.default $ | indent 2}}
    hosts:
    - host: tq.{{ .Values.global.env.dns.domain }}
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: tq-tls
      hosts:
      - tq.{{ .Values.global.env.dns.domain }}
  storegateway:
    enabled: false
    name: '{{ include "thanos.fullname" . }}-storegateway-grpc'
    service:
      name: '{{ include "thanos.fullname" . }}-storegateway'
      port: 10901
    className: konghq
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-konghq
      konghq.com/protocols: grpc,grpcs
      konghq.com/plugins: thanos-store-main-ip-restriction
    hosts:
    - host: thanos-store.{{ .Values.global.env.dns.domain }}
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: thanos-store-tls
      hosts:
      - thanos-store.{{ .Values.global.env.dns.domain }}
kong-plugins:
  enabled: false
  plugins:
  - name: thanos-store-main-ip-restriction
    plugin_name: ip-restriction
    annotations:
      kubernetes.io/ingress.class: konghq
    config:
      allow:
      - '{{ .Values.global.env.cloud.network.int_nat_gw }}'
secrets:
  thanos:
    name: thanos
    data:
      objstore.yml: |
        type: "{{ .Values.global.env.cloud.buckets.type | upper }}"
        config:
          bucket: "{{ .Values.global.company.name }}-thanos-{{ .Values.global.env.short_name }}"
query:
  enabled: false
  common:
    resources:
      limits:
        cpu: '2'
        memory: 2Gi
      requests:
        cpu: 10m
        memory: 50Mi
    strategy:
      type: RollingUpdate
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 10901
        - port: 9090
        - port: 10901
    additionalServices:
    - name: '{{ include "common.fullname" . }}-grpc'
      enabled: true
      type: ClusterIP
      ports:
      - name: grpc
        port: 10901
        targetPort: grpc
        protocol: TCP
queryFrontend:
  enabled: false
  common:
    containerName: query-frontend
    logFormat: logfmt
    ports:
    - name: http
      containerPort: 9090
      protocol: TCP
    strategy:
      type: RollingUpdate
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 9090
        - port: 9090
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
compactor:
  enabled: false
  common:
    containerName: compactor
    extraFlags:
    - --delete-delay=48h
    ports:
    - name: http
      containerPort: 10902
      protocol: TCP
    resources:
      limits:
        cpu: 1500m
        memory: 1Gi
      requests:
        cpu: 20m
        memory: 45Mi
    serviceAccount:
      create: false
      name: thanos
      automountServiceAccountToken: true
    strategy:
      type: Recreate
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
    volumes:
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: objstore-config
      mountPath: /conf
    retentionResolutionRaw: 30d
    retentionResolution5m: 60d
    retentionResolution1h: 90d
    pvcs:
      data:
        name: '{{ include "common.fullname" . }}'
        storage: 15Gi
        mountPath: /data
storegateway:
  enabled: false
  common:
    containerName: storegateway
    deploymentEnabled: false
    statefulsetEnabled: true
    resources:
      limits:
        cpu: 1000m
        memory: 3Gi
      requests:
        cpu: 10m
        memory: 50Mi
    serviceAccount:
      create: false
      name: thanos
      automountServiceAccountToken: true
    service:
      ports:
      - port: 9090
        targetPort: http
        protocol: TCP
        name: http
      - port: 10901
        targetPort: grpc
        protocol: TCP
        name: grpc
      annotations:
        konghq.com/protocol: grpc
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
        - port: 10901
        - port: 10901
    volumes:
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: objstore-config
      mountPath: /conf
    - name: data
      mountPath: /data
ruler:
  enabled: false
  common:
    containerName: ruler
    deploymentEnabled: false
    statefulsetEnabled: true
    logFormat: logfmt
    service:
      ports:
      - port: 9090
        targetPort: http
        protocol: TCP
        name: http
      - port: 10901
        targetPort: grpc
        protocol: TCP
        name: grpc
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
        - port: 10901
        - port: 10901
    volumes:
    - name: ruler-config
      configMap:
        name: '{{ include "thanos-service.prefix" . }}-ruler'
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: ruler-config
      mountPath: /conf/rules
    - name: objstore-config
      mountPath: /conf/objstore
    - name: data
      mountPath: /data
    environment:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    config: ''
    alertmanagers: []
    configMaps:
      rules:
        name: '{{ include "common.fullname" . }}'
        data:
          ruler.yml: '{{ required "ruler.common.config is required when ruler is enabled" .Values.config }}'
    podAnnotations:
      checksum/rules: '{{ .Values.config | sha256sum }}'
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
recieve:
  enabled: false
  common:
    containerName: receive
    deploymentEnabled: false
    statefulsetEnabled: true
    logFormat: logfmt
    ports:
    - containerPort: 10901
      name: grpc
      protocol: TCP
    - containerPort: 10902
      name: http
      protocol: TCP
    - containerPort: 19291
      name: remote-write
      protocol: TCP
    - containerPort: 19391
      name: capnproto
      protocol: TCP
    service:
      ports:
      - port: 10902
        targetPort: http
        protocol: TCP
        name: http
      - port: 10901
        targetPort: grpc
        protocol: TCP
        name: grpc
      - port: 19291
        targetPort: remote-write
        protocol: TCP
        name: remote
      - port: 19391
        targetPort: capnproto
        protocol: TCP
        name: capnproto
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 10902
        - port: 10901
        - port: 10901
        - port: 19291
        - port: 19291
        - port: 19391
        - port: 19391
    volumes:
    - name: hashring-config
      configMap:
        name: '{{ include "thanos-service.prefix" . }}-receive'
    volumeMounts:
    - name: hashring-config
      mountPath: /var/lib/thanos-receive
    - name: data
      mountPath: /var/thanos/receive
    environment:
    - name: NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OBJSTORE_CONFIG
      valueFrom:
        secretKeyRef:
          key: objstore.yml
          name: '{{ include "thanos-service.prefix" . }}-thanos'
    hashrings:
    - endpoints:
      - address: 127.0.0.1:10901
        capnproto_address: 127.0.0.1:19391
    configMaps:
      hashrings:
        name: '{{ include "common.fullname" . }}'
        data:
          hashrings.json: '{{ toPrettyJson .Values.hashrings }}'
    podAnnotations:
      checksum/hashrings: '{{ toJson .Values.hashrings | sha256sum }}'
    replicationFactor: 1
    retention: 15d
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
