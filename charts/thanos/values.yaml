ingresses:
  query:
    enabled: false
    name: '{{ include "thanos.fullname" . }}-query'
    service:
      name: '{{ include "thanos.fullname" . }}-query'
      port: 9090
    className: '{{ .Values.global.ingress.class }}'
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-pomerium
      ingress.pomerium.io/policy: |
        {{- tpl .Values.global.pomerium.policy.default $ | indent 2}}
    hosts:
    - host: tq.{{ .Values.global.env.dns.domain }}
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: tq-tls
      hosts:
      - tq.{{ .Values.global.env.dns.domain }}
  storegateway:
    enabled: false
    name: '{{ include "thanos.fullname" . }}-storegateway-grpc'
    service:
      name: '{{ include "thanos.fullname" . }}-storegateway'
      port: 10901
    className: konghq
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-konghq
      konghq.com/protocols: grpc,grpcs
      konghq.com/plugins: thanos-store-main-ip-restriction
    hosts:
    - host: thanos-store.{{ .Values.global.env.dns.domain }}
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: thanos-store-tls
      hosts:
      - thanos-store.{{ .Values.global.env.dns.domain }}
kong-plugins:
  enabled: false
  plugins:
  - name: thanos-store-main-ip-restriction
    plugin_name: ip-restriction
    annotations:
      kubernetes.io/ingress.class: konghq
    config:
      allow:
      - '{{ .Values.global.env.cloud.network.int_nat_gw }}'
secrets:
  thanos:
    name: thanos
    data:
      objstore.yml: |
        type: "{{ .Values.global.env.cloud.buckets.type | upper }}"
        config:
          bucket: "{{ .Values.global.company.name }}-thanos-{{ .Values.global.env.short_name }}"
query:
  enabled: false
  common:
    thanos:
      replicaLabel:
      - replica
      stores: |-
        {{- if eq .Values.global.env.type "internal" }}
        - {{ printf "thanos-%s-storegateway:10901" .Values.global.env.cloud_short_name }}
        - {{ printf "prometheus-%s-prometheus-main-thanos:8080" .Values.global.env.cloud_short_name }}
        {{- if .Values.global.externalEnvs }}
        - {{ printf "thanos-external-%s-query-grpc:10901" .Values.global.env.cloud_short_name }}
        {{- end }}
        {{- end }}
    containerName: query
    ports:
    - name: http
      containerPort: 10902
      protocol: TCP
    - name: grpc
      containerPort: 10901
    resources:
      limits:
        cpu: '2'
        memory: 2Gi
      requests:
        cpu: 10m
        memory: 50Mi
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 10901
        - port: 9090
        - port: 10901
    additionalServices:
    - name: '{{ include "common.fullname" . }}-grpc'
      enabled: true
      type: ClusterIP
      ports:
      - name: grpc
        port: 10901
        targetPort: grpc
        protocol: TCP
    args: '{{ include "thanos.query.args" . }}'
queryFrontend:
  enabled: false
  common:
    containerName: query-frontend
    strategy:
      type: RollingUpdate
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
    args: '{{ include "thanos.queryFrontend.args" . }}'
compactor:
  enabled: false
  common:
    thanos:
      concurrency: 1
      consistencyDelay: 30m
      cronJob:
        enabled: false
      dataDir: /data
      extraFlags:
      - --delete-delay=48h
      retentionResolution1h: 90d
      retentionResolution5m: 60d
      retentionResolutionRaw: 30d
    containerName: compactor
    ports:
    - name: http
      containerPort: 10902
      protocol: TCP
    resources:
      limits:
        cpu: 1500m
        memory: 1Gi
      requests:
        cpu: 20m
        memory: 45Mi
    serviceAccount:
      create: false
      name: thanos
      automountServiceAccountToken: true
    strategy:
      type: Recreate
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
    volumes:
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: objstore-config
      mountPath: /conf
    pvcs:
      data:
        name: '{{ include "common.fullname" . }}'
        storage: 15Gi
        mountPath: '{{ .Values.thanos.dataDir }}'
    args: '{{ include "thanos.compactor.args" . }}'
storegateway:
  enabled: false
  common:
    containerName: storegateway
    deploymentEnabled: false
    statefulsetEnabled: true
    resources:
      limits:
        cpu: 1000m
        memory: 3Gi
      requests:
        cpu: 10m
        memory: 50Mi
    serviceAccount:
      create: false
      name: thanos
      automountServiceAccountToken: true
    service:
      ports:
      - port: 9090
        targetPort: http
        protocol: TCP
        name: http
      - port: 10901
        targetPort: grpc
        protocol: TCP
        name: grpc
      annotations:
        konghq.com/protocol: grpc
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
        - port: 10901
    volumes:
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: objstore-config
      mountPath: /conf
    - name: data
      mountPath: /data
    args: '{{ include "thanos.storegateway.args" . }}'
ruler:
  enabled: false
  common:
    thanos:
      clusterDomain: cluster.local
      alertmanagers: []
      clusterName: ''
      containerPorts:
        grpc: 10901
        http: 10902
      dataPath: ''
      dnsDiscovery:
        enabled: true
      evalInterval: 1m
      queries: []
      replicaLabel: replica
      ruleFile: /conf/rules/*.yml
      queryURL: https://tq.{{ .Values.global.env.dns.domain }}
    containerName: ruler
    deploymentEnabled: false
    statefulsetEnabled: true
    service:
      ports:
      - port: 9090
        targetPort: http
        protocol: TCP
        name: http
      - port: 10901
        targetPort: grpc
        protocol: TCP
        name: grpc
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      ingress:
      - ports:
        - port: 10902
        - port: 9090
        - port: 10901
        - port: 10901
    volumes:
    - name: ruler-config
      configMap:
        name: '{{ include "thanos-service.prefix" . }}-ruler'
    - name: objstore-config
      secret:
        secretName: '{{ include "thanos-service.prefix" . }}-thanos'
    volumeMounts:
    - name: ruler-config
      mountPath: /conf/rules
    - name: objstore-config
      mountPath: /conf/objstore
    - name: data
      mountPath: '{{ .Values.thanos.dataPath | default "/data" }}'
    environment:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    configMaps:
      rules:
        name: '{{ include "common.fullname" . }}'
        data:
          ruler.yml: '{{ required "ruler.common.thanos.config is required when ruler is enabled" .Values.thanos.config
            }}'
    podAnnotations:
      checksum/rules: '{{ .Values.thanos.config | sha256sum }}'
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
    args: '{{ include "thanos.ruler.args" . }}'
