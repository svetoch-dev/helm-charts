      protocol: TCP
    livenessProbe: *livenessProbe
    readinessProbe: *readinessProbe
    resources:
      limits:
        cpu: 150m
        ephemeral-storage: 2Gi
        memory: 192Mi
      requests:
        cpu: 100m
        ephemeral-storage: 50Mi
        memory: 128Mi
    podSecurityContext: *podSecurityContext
    securityContext: *securityContext
    automountServiceAccountToken: true
    disableGlobalEnvironment: true
    disableGlobalEnvironmentFromSecrets: true
    affinity: *affinity
    podLabels:
      app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    serviceAccount:
      create: true
      name: ''
      automountServiceAccountToken: false
    strategy:
      type: RollingUpdate
    service:
      enabled: true
      name: '{{ include "common.fullname" . }}'
      type: ClusterIP
      ports:
      - port: 9090
        targetPort: http
        protocol: TCP
        name: http
      labels:
        prometheus-operator/monitor: 'true'
    serviceMonitor:
      enabled: true
      jobLabel: ''
      prometheusSelector:
        prometheus: main
      selectorLabels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/instance: '{{ .Release.Name }}'
        app.kubernetes.io/component: '{{ .Values.containerName }}'
        prometheus-operator/monitor: 'true'
      endpoints:
      - port: http
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    networkPolicy:
      enabled: true
      policyTypes:
      - Ingress
      - Egress
      egress:
      - {}
      ingress:
      - ports:
        - port: 9090
        - port: 9090
  compactor:
