{{- range $svc := list "query" "queryFrontend" "compactor" "storegateway" "ruler" }}
{{- $settings := get $.Values $svc }}
{{- if $settings.enabled }}
{{- $component := $settings.containerName | default $svc }}
{{- $inputs := dict "serviceMonitor" $settings.serviceMonitor "settings" $settings "root" $ "component" $component }}
{{- include "thanos.serviceMonitor" $inputs }}
{{- end }}
{{- end }}
