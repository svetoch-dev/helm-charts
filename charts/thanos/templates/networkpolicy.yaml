{{- range $svc := list "query" "queryFrontend" "compactor" "storegateway" "ruler" }}
{{- $settings := get $.Values $svc }}
{{- if $settings.enabled }}
{{- $component := $settings.workload.containerName | default $svc }}
{{- $inputs := dict "networkPolicy" $settings.networkPolicy "root" $ "component" $component }}
{{- include "thanos.networkPolicy" $inputs }}
{{- end }}
{{- end }}
