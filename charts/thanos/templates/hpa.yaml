{{- range $svc := list "query" "queryFrontend" "compactor" }}
{{- $settings := get $.Values $svc }}
{{- if $settings.enabled }}
{{- $component := $settings.containerName | default $svc }}
{{- $inputs := dict "autoscaling" $settings.autoscaling "root" $ "component" $component "serviceKey" $svc }}
{{- include "thanos.autoscaling" $inputs }}
{{- end }}
{{- end }}
