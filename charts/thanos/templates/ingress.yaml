{{- range $svc := list "query" "storegateway" }}
{{- $settings := get $.Values $svc }}
{{- if $settings.enabled }}
{{- $component := $settings.workload.containerName | default $svc }}
{{- $inputs := dict "ingress" $settings.ingress "root" $ "component" $component }}
{{- include "thanos.ingress" $inputs }}
{{- end }}
{{- end }}
