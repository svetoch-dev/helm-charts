{{- range $svc := list "query" "queryFrontend" "compactor" "storegateway" "ruler" }}
{{- $service := get $.Values $svc }}
{{- if $service.enabled }}
{{- $component := $service.containerName | default $svc }}
{{- $inputs := dict "additionalServices" $service.additionalServices "root" $ "component" $component "serviceKey" $svc }}
{{- include "thanos.service.additional" $inputs }}
{{- end }}
{{- end }}
