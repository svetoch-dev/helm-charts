{{- range $name, $secret := .Values.secrets }}
{{- $labels := include "thanos.labels" $ | fromYaml }}
{{- $secret = set $secret "name" ( printf "%s-%s" (include "thanos.fullname" $ )  $name ) }}
{{- include "core.secret" (list $ $labels $secret ) }}
{{- end }}
{{- range $svc := list "query" "queryFrontend" "compactor" "storegateway" "ruler" }}
{{- $settings := get $.Values $svc }}
{{- if $settings.enabled }}
{{- $component := $settings.containerName | default $svc }}
{{- $inputs := dict "secrets" $settings.secrets "settings" $settings "root" $ "component" $component }}
{{- include "thanos.secrets" $inputs }}
{{- end }}
{{- end }}
