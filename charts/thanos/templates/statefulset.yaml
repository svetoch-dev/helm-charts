{{- range $svc := list "storegateway" "ruler" }}
{{- $settings := get $.Values $svc }}
{{- if $settings.enabled }}
{{- $component := $settings.workload.containerName | default $svc }}
{{- $inputs := dict "workload" $settings.workload "root" $ "component" $component "serviceKey" $svc }}
{{- include "thanos.statefulset" $inputs }}
{{- end }}
{{- end }}
