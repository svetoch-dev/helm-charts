{{- range $svc := list "storegateway" "ruler" }}
{{- $settings := get $.Values $svc }}
{{- if $settings.enabled }}
{{- $component := $settings.containerName | default $svc }}
{{- $inputs := dict "settings" $settings "root" $ "component" $component }}
{{- include "thanos.statefulset" $inputs }}
{{- end }}
{{- end }}
