ingresses:
  main:
    enabled: false
    name: '{{ include "rabbitmq.fullname" . }}-main'
    service:
      name: '{{ include "rabbitmq.fullname" . }}-rabbitmq-main'
      port: 15672
    className: "{{ .Values.global.ingress.class }}"
    annotations:
      cert-manager.io/cluster-issuer: '{{ printf "letsencrypt-%s" .Values.global.ingress.class }}'
      ingress.pomerium.io/policy: |
        {{- tpl .Values.global.pomerium.policy.default $ | indent 2}}
    hosts:
      - host: "rm.{{ .Values.global.env.dns.domain }}"
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: rm-tls
        hosts:
          - "rm.{{ .Values.global.env.dns.domain }}"

rabbitmq-cluster-operator:
  enabled: false
  global:
    security:
      allowInsecureImages: true
  rabbitmqImage:
    registry: docker.io
    repository: rabbitmq
    tag: 4.4.1
    digest: sha256:183272aa2ff82718cabeef343de8d9a900931ea65fda4e563fed2a6d9efde578
  credentialUpdaterImage:
    registry: ghcr.io
    repository: rabbitmq/default-user-credential-updater
    tag: 1.0.19
    digest: sha256:cdf159cc4944ebefa43f06526f24ffb733ac78dbb0cb8c46908b1166560dd8df
  useCertManager: true
  clusterOperator:
    command:
      - /manager
    image:
      registry: ghcr.io
      repository: rabbitmq/cluster-operator
      tag: 2.23.3
      digest: sha256:487c7566e5341f00d17e5c2fd079b76a49869dd6d51081371c396f32dbbf5c6a
    resources:
      limits:
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 10m
        memory: 25Mi
  msgTopologyOperator:
    command:
      - /manager
    image:
      registry: ghcr.io
      repository: rabbitmq/messaging-topology-operator
      tag: 1.20.6
      digest: sha256:81a514ceff7eb4cf02cd7aacacdfcde7585599e646814db6676e7316e88c8b31
    resources:
      limits:
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 10m
        memory: 25Mi

rabbitmq-main:
  enabled: false
  serviceMonitor:
    enabled: true
    selector:
      prometheus: main
