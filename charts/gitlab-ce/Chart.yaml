apiVersion: v2
name: gitlab-ce
version: 0.1.0
dependencies:
  # https://gitlab.com/gitlab-org/charts/gitlab
  - name: gitlab
    version: 10.1.1
    repository: https://charts.gitlab.io
    alias: gitlab-ce
    condition: gitlab-ce.enabled
  - name: redis-operated
    version: 0.1.0
    repository: file://../chart_deps/redis/redis-operated
    alias: redis
    condition: redis.enabled
  - name: postgres-cluster
    version: 0.1.0
    repository: file://../chart_deps/postgres/postgres-cluster
    alias: postgres-main
    condition: postgres-main.enabled
