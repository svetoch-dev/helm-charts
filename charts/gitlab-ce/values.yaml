# =============================================================================
# GitLab CE Minimal POC Configuration
# =============================================================================
# This chart uses EXTERNAL PostgreSQL, Redis, and Object Storage
# Disable internal bundled services and configure external connections
# =============================================================================

# =============================================================================
# Ingress Configuration (your own ingress)
# =============================================================================
ingresses:
  # -- Main GitLab web interface
  webserver:
    enabled: false
    name: '{{ include "gitlab-ce.fullname" . }}-webserver'
    service:
      name: '{{ include "gitlab-ce.fullname" . }}-gitlab-webserver'
      port: 80
    className: "{{ .Values.global.ingress.class }}"
    annotations:
      cert-manager.io/cluster-issuer: '{{ printf "letsencrypt-%s" .Values.global.ingress.class }}'
      ingress.pomerium.io/pass_identity_headers: 'true'
      ingress.pomerium.io/policy: |
        {{- tpl .Values.global.pomerium.policy.default $ | indent 2 }}
    hosts:
    - host: "gl.{{ .Values.global.company.domain.env }}"
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: gl-tls
      hosts:
      - "gl.{{ .Values.global.company.domain.env }}"

  # -- Container Registry (enable if registry is enabled)
  registry:
    enabled: false
    name: '{{ include "gitlab-ce.fullname" . }}-registry'
    service:
      name: '{{ include "gitlab-ce.fullname" . }}-registry'
      port: 5000
    className: "{{ .Values.global.ingress.class }}"
    annotations:
      cert-manager.io/cluster-issuer: '{{ printf "letsencrypt-%s" .Values.global.ingress.class }}'
      # Registry needs large body size for image pushes
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
    hosts:
    - host: "registry.{{ .Values.global.company.domain.env }}"
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - secretName: gl-registry-tls
      hosts:
      - "registry.{{ .Values.global.company.domain.env }}"

gitlab-ce:
  enabled: false
  global:
    edition: ce
    hosts:
      domain: "{{ .Values.global.company.domain.env }}"
      gitlab:
        name: "gl.{{ .Values.global.company.domain.env }}"
        https: true
      registry:
        name: "registry.{{ .Values.global.company.domain.env }}"
        https: true
      ssh: "gl.{{ .Values.global.company.domain.env }}"
    psql:
      host: ""
      password:
        secret: ""
        key: ""
      port: 5432
      database: "gitlabhq_production"
      username: ""
  ingress:
    class: "{{ .Values.global.ingress.class }}"
    configureCertmanager: false
  # redis:
  #   host: ""
  #   auth:
  #     enabled: true
  #     secret: ""
  #     key: ""
  nginx-ingress:
    enabled: false
  installCertmanager: false
  certmanager-issuer:
    email: "test@example.com"
  certmanager:
    install: false

postgres-gitlab:
  enabled: false
  defaultSidecars:
    enabled: true
  podMonitor:
    enabled: true
    prometheusSelector:
      prometheus: main
  fluentbit:
    enabled: true
  prometheus-rules:
    enabled: true
    PrometheusAlerts:
      postgres:
        AbsentMetricCritical:
          enabled: true
          rules:
            pg_up:
              enabled: true
  teamId: devops
  replicas: 1
  resources:
    limits:
      cpu: 2000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 3Gi
  volume:
    size: 10Gi
    storageClass: premium-rwo
  databases:
    gitlabhq_production: gitlabhq_production
  preparedDatabases:
    gitlabhq_production:
      defaultUsers: true
  logicalBackup:
    enabled: true
    schedule: "40 00 * * *"
  postgresql:
    version: "17"
    parameters:
      password_encryption: "scram-sha-256"
      max_connections: "100"
      work_mem: "65536"
      max_wal_size: "2048"
      maintenance_work_mem: "262144"
      max_worker_processes: "4"
      max_parallel_workers: "4"
      max_parallel_workers_per_gather: "0"
      max_parallel_maintenance_workers: "4"
      max_standby_archive_delay: "400000"
      max_standby_streaming_delay: "400000"
      log_destination: "jsonlog"
      logging_collector: "true"

redis-gitlab:
  enabled: false
  redisServiceMonitor:
    enabled: true
    prometheusSelector:
      prometheus: gitlab-redis
  sentinelServiceMonitor:
    enabled: true
    prometheusSelector:
      prometheus: gitlab-redis
  auth:
    secretPath: gitlab-redis
  sentinel:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        memory: 200Mi
    exporter:
      enabled: true
  redis:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 10Mi
      limits:
        memory: 250Mi
    exporter:
      enabled: true
