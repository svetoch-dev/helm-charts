# =============================================================================
# PostgreSQL Configuration (deployed via postgres-cluster subchart)
# =============================================================================
postgres-cluster:
  enabled: false
  defaultSidecars:
    enabled: true
  podMonitor:
    enabled: true
    prometheusSelector:
      prometheus: main
  fluentbit:
    enabled: true
  prometheus-rules:
    enabled: true
    PrometheusAlerts:
      postgres:
        AbsentMetricCritical:
          enabled: true
          rules:
            pg_up:
              enabled: true
  teamId: devops
  replicas: 1
  resources:
    limits:
      cpu: 2000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 3Gi
  volume:
    size: 10Gi
    storageClass: premium-rwo
  databases:
    gitlabhq_production: gitlabhq_production
  preparedDatabases:
    gitlabhq_production:
      defaultUsers: true
  logicalBackup:
    enabled: true
    schedule: "40 00 * * *"
  postgresql:
    version: "17"
    parameters:
      password_encryption: "scram-sha-256"
      max_connections: "100"
      work_mem: "65536"
      max_wal_size: "2048"
      maintenance_work_mem: "262144"
      max_worker_processes: "4"
      max_parallel_workers: "4"
      max_parallel_workers_per_gather: "0"
      max_parallel_maintenance_workers: "4"
      max_standby_archive_delay: "400000"
      max_standby_streaming_delay: "400000"
      log_destination: "jsonlog"
      logging_collector: "true"

# =============================================================================
# Redis Configuration (deployed via redis-operated subchart)
# =============================================================================
redis:
  enabled: true
  redisServiceMonitor:
    enabled: true
    prometheusSelector:
      prometheus: gitlab-redis
  sentinelServiceMonitor:
    enabled: true
    prometheusSelector:
      prometheus: gitlab-redis
  auth:
    secretPath: gitlab-redis
  sentinel:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        memory: 200Mi
    exporter:
      enabled: true
  redis:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 10Mi
      limits:
        memory: 250Mi
    exporter:
      enabled: true

