# # =============================================================================
# # GCP Workload Identity Setup
# # =============================================================================
# #
# # 1. Create GCP Service Account:
# #    gcloud iam service-accounts create gitlab-sa \
# #      --display-name="GitLab Service Account"
# #
# # 2. Grant GCS permissions to GSA:
# #    gsutil iam ch serviceAccount:gitlab-sa@PROJECT_ID.iam.gserviceaccount.com:objectAdmin \
# #      gs://YOUR_GITLAB_BUCKET
# #    # Repeat for all buckets (lfs, artifacts, uploads, packages, etc.)
# #
# # 3. Bind KSA to GSA (Workload Identity):
# #    gcloud iam service-accounts add-iam-policy-binding \
# #      gitlab-sa@PROJECT_ID.iam.gserviceaccount.com \
# #      --role roles/iam.workloadIdentityUser \
# #      --member "serviceAccount:PROJECT_ID.svc.id.goog[gitlab-ce/gitlab]"
# #
# # 4. Create object storage connection secret (Workload Identity - no key needed):
# #    kubectl create secret generic gitlab-object-storage \
# #      --from-file=connection=gcs-connection.yaml
# #
# #    gcs-connection.yaml (Workload Identity):
# #    ---
# #    provider: Google
# #    google_project: YOUR_GCP_PROJECT_ID
# #    google_application_default: true
# #
# # 5. For registry storage (if enabled):
# #    kubectl create secret generic gitlab-registry-storage \
# #      --from-file=config=registry-gcs-config.yaml
# #
# #    registry-gcs-config.yaml (Workload Identity):
# #    ---
# #    gcs:
# #      bucket: gitlab-registry
# #    # No keyfile needed - uses Workload Identity
# #
# # =============================================================================