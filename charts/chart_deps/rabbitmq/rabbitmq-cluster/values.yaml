image: docker.io/rabbitmq:4.4.1
fullnameOverride: ""
nameOverride: ""
prometheusSelector: {}
annotations: {}
replicas: 3
terminationGracePeriodSeconds: 300
rabbitmq:
  additionalConfig: |
    log.console.formatter = json
    # Restore undersized quorum groups when another broker is available.
    quorum_queue.continuous_membership_reconciliation.enabled = true
    quorum_queue.continuous_membership_reconciliation.target_group_size = 3
    quorum_queue.continuous_membership_reconciliation.interval = 60000
persistence: {}
tolerations: {}
affinity: {}
override:
  statefulSet:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: '{{ include "rabbitmq-cluster.fullname" . }}'
        spec:
          containers:
            - name: rabbitmq
          initContainers:
            - name: setup-container
              resources:
                limits:
                  cpu: 300m
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: '{{ include "rabbitmq-cluster.fullname" . }}'
vhosts: {}
serviceMonitor:
  metric_families:
    - queue_coarse_metrics
    - queue_metrics
    - connection_churn_metrics
    - node_metrics
    - node_coarse_metrics
    - channel_queue_exchange_metrics
    - channel_queue_metrics
