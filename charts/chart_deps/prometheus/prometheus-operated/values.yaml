nameOverride: ""
fullnameOverride: ""

labels: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

service:
  enabled: false
  type: ClusterIP
  annotations: {}
  ports:
    - port: 80
      targetPort: http-web
      protocol: TCP
      name: http

thanosService:
  enabled: false
  type: ClusterIP
  annotations: {}
  ports:
    - port: 8080
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 80
      targetPort: http
      protocol: TCP
      name: http

servicemonitor:
  enabled: false
  prometheusSelector: {}
  labels: {}
  targetLabels: []
  #endpoints:
  #  - port: http
  #    path: /metrics

thanosServiceMonitor:
  enabled: false
  prometheusSelector: {}
  labels: {}
  targetLabels: []
  #endpoints:
  #  - port: http
  #    path: /metrics

thanosIngress:
  enabled: false
  className: ""
  service:
    port: 8080
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

ingress:
  enabled: false
  className: ""
  service:
    port: 80
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

prometheus:
  labels: {}
  spec:
    podMetadata: {}

    serviceMonitorSelector:
    serviceMonitorNamespaceSelector: {}

    podMonitorSelector:
    podMonitorNamespaceSelector: {}

    probeSelector:
    probeNamespaceSelector: {}

    ruleSelector:
    ruleNamespaceSelector: {}

    scrapeConfigSelector: {}
    scrapeConfigNamespaceSelector: {}
    scrapeClasses: []

    paused: false

    image: "quay.io/prometheus/prometheus:v3.16.0@sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd"

    version: "v3.16.0"

    imagePullPolicy: IfNotPresent

    imagePullSecrets: []

    replicas: 1

    shards: 1

    replicaExternalLabelName:

    prometheusExternalLabelName:

    logLevel: info

    logFormat: json

    scrapeInterval: "30s"

    scrapeTimeout: "10s"

    externalLabels: {}

    enableRemoteWriteReceiver: false

    enableFeatures: []

    externalUrl: "https://pm.{{ .Values.global.env.dns.domain }}"

    routePrefix: "/"

    storage: {}

    volumes: {}

    volumeMounts: {}

    persistentVolumeClaimRetentionPolicy: {}

    web: {}

    resources: {}

    nodeSelector: {}

    secrets: []

    configMaps: []

    affinity: {}

    tolerations: []

    topologySpreadConstraints: []

    remoteWrite: []

    securityContext:
      fsGroup: 2000
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

    listenLocal: false

    containers: |-
      {{- if has $.Values.global.env.cloud.name .Values.global.vedro.principals.staticCredsClouds }}
      - name: thanos-sidecar
        envFrom:
          - secretRef:
              name: {{ .Values.global.vedro.principals.default.secretName | default "bucket" }}
      {{- end }}
    initContainers: []

    additionalScrapeConfigs: {}

    apiserverConfig: {}

    priorityClassName:

    portName: "http-web"

    arbitraryFSAccessThroughSMs:

    overrideHonorLabels: false

    overrideHonorTimestamps: false

    ignoreNamespaceSelectors: false

    enforcedNamespaceLabel: ""

    enforcedTargetLimit:

    enforcedLabelLimit:

    enforcedLabelNameLengthLimit:

    enforcedLabelValueLengthLimit:

    enforcedKeepDroppedTargets:

    enforcedBodySizeLimit:

    minReadySeconds: 0

    hostAliases: []

    additionalArgs: []

    walCompression: true

    excludedFromEnforcement: []

    hostNetwork: false

    podTargetLabels: []

    tracingConfig: []

    bodySizeLimit:

    sampleLimit:

    targetLimit:

    labelLimit:

    labelNameLengthLimit:

    labelValueLengthLimit:

    keepDroppedTargets:

    retention: "8h"

    disableCompaction: false

    rules: []

    prometheusRulesExcludedFromEnforce: []

    query: {}

    alerting: {}
  #    alertmanagers:
  #      - name: main-alertmanager
  #        namespace: prometheus
  #        port: http-web

    additionalAlertRelabelConfigs: {}

    additionalAlertManagerConfigs: {}

    remoteRead: []

    thanos:
      image: quay.io/thanos/thanos:v0.42.5@sha256:0a546b98a8dd47735456ab389983675ee363d68127e334937a9fceeea10da5e7
      version: v0.42.5
      blockSize: "2h"
      objectStorageConfig:
        name: '{{ include "prometheus-operated.fullname" . }}-thanos'
        key: objstore.yml
      resources:
        limits:
          cpu: '1'
          memory: 500Mi
        requests:
          cpu: 10m
          memory: 35Mi

    queryLogFile:

    exemplars: {}

    evaluationInterval: "30s"

    enableAdminAPI: false

    serviceDiscoveryRole: "EndpointSlice"

    tsdb:
      outOfOrderTimeWindow: 0s


secrets:
  thanos:
    name: thanos
    data:
      objstore.yml: "{{ tpl .Values.global.thanos.objstore $ }}"

vedro:
  principals:
    prometheus:
      provider: thanos
      kind: ServiceAccount
      type: Managed
      managed:
        name: "{{ .Release.Name }}"
      auth: "{{ tpl .Values.global.vedro.principals.default.auth $ | indent 2 }}"
