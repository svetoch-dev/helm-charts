# Shared resource and Thanos defaults. The consuming chart supplies command/args.
# StatefulSet settings take effect when common.statefulsetEnabled is true.
common:
  thanos:
    logLevel: info
    logFormat: json
    extraFlags: []
    https:
      enabled: false
  fullnameOverride: '{{ include "thanos-service.prefix" . }}-{{ .Values.containerName }}'
  selectorLabels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/component: '{{ .Values.containerName }}'
  image:
    repository: quay.io/thanos/thanos
    tag: v0.41.0
  revisionHistoryLimit: 10
  livenessProbe:
    failureThreshold: 6
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 30
    httpGet:
      path: /-/healthy
      port: http
      scheme: HTTP
  readinessProbe:
    failureThreshold: 6
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 30
    httpGet:
      path: /-/ready
      port: http
      scheme: HTTP
  podSecurityContext:
    fsGroup: 1001
    fsGroupChangePolicy: Always
    supplementalGroups: []
    sysctls: []
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsGroup: 1001
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile:
      type: RuntimeDefault
    seLinuxOptions: {}
  automountServiceAccountToken: true
  disableGlobalEnvironment: true
  disableGlobalEnvironmentFromSecrets: true
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: thanos
              app.kubernetes.io/instance: '{{ .Release.Name }}'
              app.kubernetes.io/component: '{{ .Values.containerName }}'
          topologyKey: kubernetes.io/hostname
  podLabels:
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
  service:
    labels:
      prometheus-operator/monitor: 'true'
    ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http
  serviceMonitor:
    enabled: true
    jobLabel: ''
    selectorLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/instance: '{{ .Release.Name }}'
      app.kubernetes.io/component: '{{ .Values.containerName }}'
      prometheus-operator/monitor: 'true'
    endpoints:
    - port: http
  networkPolicy:
    enabled: true
    policyTypes:
    - Ingress
    - Egress
    egress:
    - {}
  containerName: query
  ports:
  - name: http
    containerPort: 10902
    protocol: TCP
  - name: grpc
    containerPort: 10901
    protocol: TCP
  serviceAccount:
    automountServiceAccountToken: false
  serviceName: '{{ include "common.fullname" . }}-headless'
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  volumeClaimTemplates:
    data:
      metadata:
        name: data
      storage: 8Gi
      accessModes:
      - ReadWriteOnce
