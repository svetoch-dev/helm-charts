{{- $obj := deepCopy .Values.networkPolicy }}
{{- $labels := include "common.labels" . | fromYaml }}
{{- $_ := set $obj "name" ($obj.name | default (include "common.fullname" .)) }}
{{- $_ := set $obj "selectorLabels" (include "common.selectorLabels" . | fromYaml) }}
{{- include "core.networkPolicy" (list $ $labels $obj) }}
